  <title>Sesli — Türkçe Metin Seslendirme</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F6F7F4; }
    #sesli-boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #16302C; background: #F6F7F4;
    }
    #sesli-boot .mark {
      width: 76px; height: 76px; border-radius: 20px; background: #0F766E;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 30px rgba(15, 118, 110, .22);
    }
    #sesli-boot .bars { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
    #sesli-boot .bars i { display: block; width: 7px; border-radius: 4px; background: #F6F7F4; }
    #sesli-boot .bars i:nth-child(1) { height: 14px; }
    #sesli-boot .bars i:nth-child(2) { height: 28px; background: #E9C46A; }
    #sesli-boot .bars i:nth-child(3) { height: 20px; }
    #sesli-boot .bars i:nth-child(4) { height: 32px; background: #E9C46A; }
    #sesli-boot .bars i:nth-child(5) { height: 12px; }
    #sesli-boot h1 { font-size: 22px; margin: 0; letter-spacing: -0.4px; }
    #sesli-boot p { margin: 0; font-size: 13px; color: #5B6B67; }
    @media (prefers-color-scheme: dark) {
      html, body, #sesli-boot { background: #0D1514; color: #E8EFED; }
      #sesli-boot p { color: #9AA9A5; }
    }
  </style>
</head>
<body>
  <div id="sesli-boot">
    <div class="mark"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
    <h1>Sesli</h1>
    <p>Metniniz, doğal Türkçe sesle.</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (error) {
          console.warn('Çevrimdışı önbellek kaydedilemedi:', error);
        });
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('sesli-boot');
      if (!boot) return;
      boot.style.transition = 'opacity 220ms ease';
      boot.style.opacity = '0';
      window.setTimeout(function () {
        if (boot.parentNode) boot.parentNode.removeChild(boot);
      }, 260);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
